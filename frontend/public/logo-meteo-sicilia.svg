<svg width="560" height="150" viewBox="0 0 560 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meteo Sicilia">
  <defs>
    <radialGradient id="ms-sun" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="38%" stop-color="#FFB957"/>
      <stop offset="72%" stop-color="#FF7A59"/>
      <stop offset="100%" stop-color="#FF4E78"/>
    </radialGradient>
    <radialGradient id="ms-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A4C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF8A4C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ms-island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B2E7E"/>
      <stop offset="100%" stop-color="#2A1645"/>
    </linearGradient>
    <linearGradient id="ms-text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A4C"/>
      <stop offset="60%" stop-color="#FF4E78"/>
      <stop offset="100%" stop-color="#B14CC0"/>
    </linearGradient>
  </defs>

  <!-- ===== ICONA ===== -->
  <g transform="translate(12,12)">
    <!-- Alone caldo -->
    <circle cx="60" cy="42" r="50" fill="url(#ms-glow)"/>

    <!-- Raggi (semicerchio superiore) -->
    <g stroke="#FFB04C" stroke-width="3.1" stroke-linecap="round" opacity="0.9">
      <line x1="94" y1="42" x2="103" y2="42"/>
      <line x1="91.4" y1="29" x2="99.7" y2="25.5"/>
      <line x1="84" y1="18" x2="90.4" y2="11.6"/>
      <line x1="73" y1="10.6" x2="76.5" y2="2.3"/>
      <line x1="60" y1="8" x2="60" y2="0"/>
      <line x1="47" y1="10.6" x2="43.5" y2="2.3"/>
      <line x1="36" y1="18" x2="29.6" y2="11.6"/>
      <line x1="28.6" y1="29" x2="20.3" y2="25.5"/>
      <line x1="26" y1="42" x2="17" y2="42"/>
    </g>

    <!-- Sole che tramonta dietro l'isola -->
    <circle cx="60" cy="42" r="30" fill="url(#ms-sun)"/>

    <!-- Sagoma reale della Sicilia (ricostruita da 19 punti costieri reali:
         Capo Peloro NE, Marsala O, Capo Passero S = la Trinacria) -->
    <path transform="translate(8,38) scale(0.5)"
          d="M 200,0 C 203.2,0.4 197.5,0.8 193.8,6.3 C 190.1,11.8 182.4,23.9 177.6,32.9
             C 172.8,41.9 165.9,52.2 165.2,60.3 C 164.5,68.4 171.2,75.9 173.3,81.5
             C 175.4,87.1 178.4,87 177.6,94 C 176.8,101.1 179.1,123.8 168.3,123.8
             C 157.5,123.8 125.4,99.4 113,94 C 100.6,88.7 100.7,94.3 93.8,91.7
             C 86.9,89.1 80.3,83.8 71.4,78.4 C 62.5,73.1 50.7,64.6 40.4,59.6
             C 30.2,54.6 16.6,52.4 9.9,48.6 C 3.2,44.8 0.8,41.6 0,36.8
             C -0.8,32 1.9,24.6 5,19.6 C 8.1,14.7 9.8,8.4 18.6,7.1
             C 27.4,5.8 44.4,10 57.8,11.8 C 71.2,13.6 84.5,18.3 98.8,18
             C 113.1,17.7 130.9,12.6 143.5,10.2 C 156.1,7.9 165.1,5.6 174.5,3.9
             C 183.9,2.2 196.8,-0.4 200,0 Z"
          fill="url(#ms-island)"/>

    <!-- Riflesso del mare -->
    <g stroke="#FF7A59" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <line x1="42" y1="106" x2="70" y2="106"/>
      <line x1="78" y1="106" x2="100" y2="106"/>
      <line x1="52" y1="114" x2="92" y2="114"/>
    </g>
  </g>

  <!-- ===== WORDMARK ===== -->
  <text x="168" y="80" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif"
        font-size="52" letter-spacing="-1">
    <tspan fill="currentColor" font-weight="600">Meteo</tspan><tspan fill="url(#ms-text)" font-weight="800"> Sicilia</tspan>
  </text>
  <text x="170" y="108" font-family="'Segoe UI', system-ui, sans-serif" font-size="14"
        letter-spacing="4.5" fill="currentColor" opacity="0.55" font-weight="600">METEO IN TEMPO REALE</text>
</svg>
