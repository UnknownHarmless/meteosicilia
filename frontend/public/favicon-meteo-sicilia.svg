<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meteo Sicilia">
  <defs>
    <!-- Cielo al tramonto -->
    <linearGradient id="fav-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9A0"/>
      <stop offset="42%" stop-color="#FF9E7A"/>
      <stop offset="74%" stop-color="#E0608F"/>
      <stop offset="100%" stop-color="#6B3FA0"/>
    </linearGradient>
    <radialGradient id="fav-sun" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FFF3C9"/>
      <stop offset="45%" stop-color="#FFCB6B"/>
      <stop offset="100%" stop-color="#FF8A4C"/>
    </radialGradient>
    <linearGradient id="fav-island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E2160"/>
      <stop offset="100%" stop-color="#1E1138"/>
    </linearGradient>
    <clipPath id="fav-clip"><rect x="2" y="2" width="124" height="124" rx="28"/></clipPath>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#fav-sky)"/>

  <g clip-path="url(#fav-clip)">
    <!-- Raggi -->
    <g stroke="#FFF1C2" stroke-width="3.4" stroke-linecap="round" opacity="0.85">
      <line x1="96" y1="50" x2="105" y2="50"/>
      <line x1="92" y1="35" x2="99.8" y2="30.5"/>
      <line x1="81" y1="24" x2="85.5" y2="16.2"/>
      <line x1="66" y1="20" x2="66" y2="11"/>
      <line x1="51" y1="24" x2="46.5" y2="16.2"/>
      <line x1="40" y1="35" x2="32.2" y2="30.5"/>
      <line x1="36" y1="50" x2="27" y2="50"/>
    </g>

    <!-- Sole -->
    <circle cx="66" cy="50" r="26" fill="url(#fav-sun)"/>

    <!-- Sagoma reale della Sicilia (stessi 19 punti costieri del logo) -->
    <path transform="translate(6,44) scale(0.58)"
          d="M 200,0 C 203.2,0.4 197.5,0.8 193.8,6.3 C 190.1,11.8 182.4,23.9 177.6,32.9
             C 172.8,41.9 165.9,52.2 165.2,60.3 C 164.5,68.4 171.2,75.9 173.3,81.5
             C 175.4,87.1 178.4,87 177.6,94 C 176.8,101.1 179.1,123.8 168.3,123.8
             C 157.5,123.8 125.4,99.4 113,94 C 100.6,88.7 100.7,94.3 93.8,91.7
             C 86.9,89.1 80.3,83.8 71.4,78.4 C 62.5,73.1 50.7,64.6 40.4,59.6
             C 30.2,54.6 16.6,52.4 9.9,48.6 C 3.2,44.8 0.8,41.6 0,36.8
             C -0.8,32 1.9,24.6 5,19.6 C 8.1,14.7 9.8,8.4 18.6,7.1
             C 27.4,5.8 44.4,10 57.8,11.8 C 71.2,13.6 84.5,18.3 98.8,18
             C 113.1,17.7 130.9,12.6 143.5,10.2 C 156.1,7.9 165.1,5.6 174.5,3.9
             C 183.9,2.2 196.8,-0.4 200,0 Z"
          fill="url(#fav-island)"/>

    <!-- Riflessi sul mare -->
    <g stroke="#FFE3C2" stroke-width="3.2" stroke-linecap="round" opacity="0.6">
      <line x1="34" y1="110" x2="60" y2="110"/>
      <line x1="68" y1="110" x2="92" y2="110"/>
      <line x1="44" y1="119" x2="84" y2="119"/>
    </g>
  </g>
</svg>
